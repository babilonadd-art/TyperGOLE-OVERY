name: TyperGOLE-OVERY — PREMATCH GOALKEEPER SAVES

on:
  push:
    branches: [main]
    paths:
      - "prematch_sot.py"
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/prematch-sot.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-prematch-saves
  cancel-in-progress: true

jobs:
  prematch-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main and persistent state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile modules
        run: python -m py_compile bot.py prematch_sot.py
      - name: Scan prematch goalkeeper saves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python prematch_sot.py
      - name: Save saves duplicate protection state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/prematch_saves_state.json ]; then
            git add data/prematch_saves_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist prematch goalkeeper saves state"
            git push
          fi
