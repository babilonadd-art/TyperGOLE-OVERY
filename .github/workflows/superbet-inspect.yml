name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public event structure
        run: |
          python - <<'PY'
          import json, requests
          url = "https://production-superbet-offer-pl.freetls.fastly.net/v2/pl-PL/struct"
          headers = {"User-Agent": "Mozilla/5.0", "Origin": "https://superbet.pl", "Referer": "https://superbet.pl/"}
          r = requests.get(url, headers=headers, timeout=30)
          print("HTTP", r.status_code, "bytes", len(r.content))
          r.raise_for_status()
          data = r.json()
          terms = ("14572637", "Machida", "Shanghai", "Over 2.5", "over")
          found = 0
          def walk(obj, path="$", depth=0):
              global found
              if found >= 120 or depth > 18:
                  return
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = path + "." + str(k)
                      if any(t.lower() in str(k).lower() for t in terms):
                          print("KEY", p, str(v)[:500])
                          found += 1
                      walk(v, p, depth + 1)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      walk(v, path + "[" + str(i) + "]", depth + 1)
              elif isinstance(obj, (str, int, float)):
                  s = str(obj)
                  if any(t.lower() in s.lower() for t in terms):
                      print("VALUE", path, s[:500])
                      found += 1
          walk(data)
          print("MATCHES", found)
          PY
