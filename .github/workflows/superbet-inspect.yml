name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect relevant Superbet async chunks
        run: |
          python - <<'PY'
          import requests,re
          base="https://superbet.pl"; h={"User-Agent":"Mozilla/5.0","Referer":base+"/"}
          b=requests.get(base+"/static/js/index.fa0434cf.js",headers=h,timeout=30).text
          tail=b[b.find('o.u=function'):]
          a=tail.find('(({')+3; z=tail.find('})[e]||e)')
          names=dict(re.findall(r'([0-9]+):"([a-zA-Z0-9_-]+)"',tail[a:z]))
          rest=tail[z:]
          hashes=dict(re.findall(r'([0-9]+):"([0-9a-f]{8})"',rest))
          print("NAMED",names)
          for i in ("4772","79535","30354","31328","49111","77016"):
              if i not in hashes: print("NO_HASH",i); continue
              name=names.get(i,i)
              url=f"{base}/static/js/async/{name}.{hashes[i]}.js"
              try:
                  r=requests.get(url,headers=h,timeout=30); body=r.text; low=body.lower()
                  print("CHUNK",i,name,r.status_code,len(body),url)
                  for term in ("marketuuid","outcomeid","oddid","betslip","selection","urlsearchparams","location.search","marketlineuuid"):
                      p=low.find(term)
                      if p>=0: print("HIT",term,body[max(0,p-250):p+500])
              except Exception as e: print("ERR",i,repr(e))
          PY
