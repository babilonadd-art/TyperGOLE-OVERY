name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace Superbet JavaScript entrypoint
        run: |
          python - <<'PY'
          import requests,re
          base="https://superbet.pl"
          h={"User-Agent":"Mozilla/5.0","Referer":base+"/"}
          r=requests.get(base+"/static/js/index.fa0434cf.js",headers=h,timeout=30)
          b=r.text
          print("ENTRY",r.status_code,len(b),r.headers.get("content-type"))
          print("PREFIX",b[:3000])
          chunks=sorted(set(re.findall(r"[A-Za-z0-9_./-]+\\.js",b)))
          print("CHUNKS",len(chunks))
          for x in chunks[:150]: print("CHUNK",x)
          low=b.lower()
          for term in ("marketuuid","outcomeid","oddid","betslip","selection","location.search","urlsearchparams"):
              p=low.find(term)
              if p>=0: print("TERM",term,b[max(0,p-300):p+500])
          PY
