name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect event-specific public data
        run: |
          python - <<'PY'
          import json, requests, re
          H={"User-Agent":"Mozilla/5.0","Origin":"https://superbet.pl","Referer":"https://superbet.pl/"}
          base="https://production-superbet-offer-pl.freetls.fastly.net"
          struct=requests.get(base+"/v2/pl-PL/struct",headers=H,timeout=30).json()["data"]
          print("STRUCT_KEYS",list(struct.keys()))
          for key in ("events","markets","outcomes","eventGroups","marketGroups"):
              val=struct.get(key)
              if isinstance(val,dict):
                  print("DICT",key,"count",len(val),"sample",list(val.items())[:2])
              elif isinstance(val,list):
                  print("LIST",key,"count",len(val),"sample",val[:2])
          for path in (
              "/v3/subscription/pl-PL/events/14572637",
              "/v3/subscription/pl-PL/event/14572637",
              "/v2/pl-PL/events/14572637",
              "/v3/pl-PL/events/14572637",
              "/subscription/v2/pl-PL/events/14572637",
              "/subscription/v2/pl-PL/event/14572637",
          ):
              try:
                  r=requests.get(base+path,headers={**H,"Accept":"text/event-stream, application/json"},timeout=12,stream=True)
                  lines=[]
                  for line in r.iter_lines(decode_unicode=True):
                      if line:
                          lines.append(line)
                      if len(lines)>=35: break
                  print("ENDPOINT",path,"HTTP",r.status_code,"TYPE",r.headers.get("content-type"),"LINES",lines[:35])
                  r.close()
              except Exception as e: print("ERR",path,repr(e))
          PY
