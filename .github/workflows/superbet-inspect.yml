name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find Superbet public share and selection routes
        run: |
          python - <<'PY'
          import requests,re
          base="https://superbet.pl"; h={"User-Agent":"Mozilla/5.0","Referer":base+"/"}
          b=requests.get(base+"/static/js/index.fa0434cf.js",headers=h,timeout=30).text
          tail=b[b.find('o.u=function'):]
          a=tail.find('(({')+3; z=tail.find('})[e]||e)')
          names=dict(re.findall(r'([0-9]+):"([a-zA-Z0-9_-]+)"',tail[a:z]))
          hashes=dict(re.findall(r'([0-9]+):"([0-9a-f]{8})"',tail[z:]))
          targets=set(re.findall(r'"([0-9]+)"',tail[a:z]))
          terms=("shareTicket","share-ticket","shareBet","shareBetSlip","shareUrl","copyTicket","copySelection","addCopiedSelection","addSingleSelection","ticketCode","externalTicketId","copiedTicket","skopiuj_kupon","ticketId")
          print("CHUNK_COUNT",len(hashes))
          for i,hashv in hashes.items():
              name=names.get(i,i)
              url=f"{base}/static/js/async/{name}.{hashv}.js"
              try:
                  r=requests.get(url,headers=h,timeout=15)
                  if r.status_code!=200 or len(r.text)<100: continue
                  body=r.text
                  found=[]
                  for term in terms:
                      p=body.lower().find(term.lower())
                      if p>=0: found.append((term,p))
                  if found:
                      print("\\nCHUNK",i,name,len(body),url)
                      for term,p in found:
                          print("HIT",term,body[max(0,p-500):min(len(body),p+1300)])
              except Exception as e:
                  pass
          PY

      - name: Verify goal market group on a public event
        run: |
          python - <<'PY'
          import requests
          url="https://production-superbet-offer-pl.freetls.fastly.net/v2/pl-PL/events/14572637"
          r=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"},timeout=25)
          print("EVENT_STATUS",r.status_code)
          r.raise_for_status()
          data=r.json()
          def walk(x,path="$"):
              if isinstance(x,dict):
                  if any(k in x for k in ("marketGroup","marketGroupId","groupId","groupName","marketName")):
                      print("MARKET_NODE",path,{k:x.get(k) for k in x if k.lower() in ("id","name","title","marketgroup","marketgroupid","groupid","groupname","marketname","label")})
                  for k,v in x.items(): walk(v,path+"."+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f"[{i}]")
          walk(data)
          PY
