name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact event market identifiers
        run: |
          python - <<'PY'
          import requests, json
          event_id = "14572637"
          base = "https://production-superbet-offer-pl.freetls.fastly.net"
          h = {"User-Agent":"Mozilla/5.0","Origin":"https://superbet.pl","Referer":"https://superbet.pl/"}
          r = requests.get(f"{base}/v2/pl-PL/events/{event_id}",headers=h,timeout=30)
          print("HTTP",r.status_code)
          r.raise_for_status()
          payload = r.json()
          data = payload.get("data",[])
          if isinstance(data,dict): data=[data]
          for event in data:
              print("EVENT", {k:event.get(k) for k in ("eventId","matchName","matchDate","marketCount","offerStateStatus")})
              for odd in event.get("odds",[]):
                  label = " ".join(str(odd.get(k,"")) for k in ("marketName","name","info"))
                  if any(x in label.lower() for x in ("rożnych","rzutów rożnych","corner")):
                      print("CORNER",json.dumps({k:odd.get(k) for k in ("uuid","marketUuid","marketId","outcomeId","price","status","specialBetValue","specifiers","marketName","name","info","marketGroupOrder","marketCode","code","oddComponents")},ensure_ascii=False))
          PY
