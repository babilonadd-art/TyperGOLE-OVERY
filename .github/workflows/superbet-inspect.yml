name: Superbet public data diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superbet-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public live feed and event details
        run: |
          python - <<'PY'
          import requests, json
          base = "https://production-superbet-offer-pl.freetls.fastly.net"
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          paths = [
              "/v2/pl-PL/struct",
              "/subscription/v2/pl-PL/structure",
              "/v3/subscription/pl-PL/events/live/count",
              "/v3/subscription/pl-PL/events/live",
              "/v2/pl-PL/events/14572637",
          ]
          for path in paths:
              try:
                  response = requests.get(base + path, headers=headers, timeout=20)
                  print("\\nENDPOINT", path, "STATUS", response.status_code,
                        "TYPE", response.headers.get("content-type"), flush=True)
                  if response.status_code != 200:
                      print("BODY", response.text[:500], flush=True)
                      continue
                  try:
                      data = response.json()
                      print("JSON", json.dumps(data, ensure_ascii=False)[:16000], flush=True)
                  except Exception as exc:
                      print("JSON_ERROR", type(exc).__name__, str(exc),
                            "BODY", response.text[:1000], flush=True)
              except Exception as exc:
                  print("REQUEST_ERROR", path, type(exc).__name__, str(exc), flush=True)
          PY
