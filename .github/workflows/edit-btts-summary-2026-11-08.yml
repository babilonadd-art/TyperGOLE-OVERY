name: Correct BTTS FT daily summary 2026-11-08

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edit-btts-summary-2026-11-08.yml"

permissions:
  contents: read

jobs:
  edit-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Replace previous Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests

          report = (
              "📊 PODSUMOWANIE DNIA — BTTS FT\n"
              "📅 8 listopada 2026 — AKTUALIZACJA\n\n"
              "📨 Wysłane typy: 32\n"
              "✅ Rozliczone: 30\n"
              "🟢 Wygrane: 26\n"
              "🔴 Przegrane: 4\n"
              "⏳ Oczekujące: 2 (Zawisza — mecz przełożony; Humble Lions — mecz przerwany)\n\n"
              "Obrót rozliczonych typów: 300,00 zł\n"
              "ZYSK NETTO: +124,51 zł\n"
              "Yield: +41,50%\n\n"
              "Typy przełożone/przerwane pozostają poza bilansem. "
              "Wynik uwzględnia 6 dodatkowych wygranych potwierdzonych w korekcie."
          )
          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/editMessageText",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "message_id": 430,
                  "text": report,
                  "disable_web_page_preview": True,
              },
              timeout=20,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise RuntimeError(payload)
          print("TELEGRAM_EDIT_OK message_id=430")
          print(report)
          PY
