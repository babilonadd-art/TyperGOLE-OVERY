name: Superbet live feed probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public event feeds
        run: |
          python - <<'PY'
          import json, requests
          base = "https://production-superbet-offer-pl.freetls.fastly.net"
          h = {"User-Agent": "Mozilla/5.0", "Accept": "application/json, text/event-stream", "Origin": "https://superbet.pl", "Referer": "https://superbet.pl/"}
          paths = [
              "/v3/subscription/pl-PL/events/live",
              "/v3/subscription/pl-PL/events/live/",
              "/v2/pl-PL/events/live",
              "/v2/pl-PL/events?state=live",
              "/v2/pl-PL/events?status=live",
              "/v3/subscription/pl-PL/events/tournament:104431",
              "/v3/subscription/pl-PL/events/live/tournament:104431",
              "/v3/subscription/pl-PL/tournament/104431/events",
              "/v2/pl-PL/tournaments/104431/events",
          ]
          for path in paths:
              try:
                  with requests.get(base + path, headers=h, timeout=(8, 5), stream=True) as r:
                      print("PROBE", path, "STATUS", r.status_code, "TYPE", r.headers.get("content-type"), flush=True)
                      if r.status_code == 200:
                          chunks = []
                          total = 0
                          for chunk in r.iter_content(chunk_size=4096):
                              if chunk:
                                  chunks.append(chunk)
                                  total += len(chunk)
                              if total >= 12000:
                                  break
                          body = b"".join(chunks).decode("utf-8", "replace")
                          print("BODY", path, body[:5000].replace("\\n", " "), flush=True)
              except Exception as e:
                  print("ERROR", path, type(e).__name__, str(e)[:300], flush=True)
          PY
