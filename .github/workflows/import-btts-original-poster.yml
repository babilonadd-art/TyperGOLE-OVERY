name: Import original BTTS poster from Issue #2

on:
  push:
    paths:
      - ".github/workflows/import-btts-original-poster.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the exact Issue #2 attachment
        run: |
          mkdir -p assets
          curl --location --fail --retry 3 --retry-all-errors \
            "https://github.com/user-attachments/assets/f879a56c-d93e-4c11-abb5-c8fe38aa6691" \
            --output assets/btts_original_poster.png
          file assets/btts_original_poster.png
          python - <<'PY'
          from PIL import Image
          image = Image.open("assets/btts_original_poster.png")
          print("Original poster:", image.format, image.size)
          if image.size != (720, 1640):
              raise SystemExit(f"Unexpected poster dimensions: {image.size}")
          image.verify()
          PY
      - name: Commit the original poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/btts_original_poster.png
          git commit -m "Add original BTTS poster from issue attachment"
          git push
