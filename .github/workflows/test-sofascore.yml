name: SofaScore connectivity test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "test_sofascore.py"
      - ".github/workflows/test-sofascore.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install curl_cffi
        run: pip install "curl_cffi>=0.13,<1"
      - name: Test one public live endpoint request
        run: python test_sofascore.py
