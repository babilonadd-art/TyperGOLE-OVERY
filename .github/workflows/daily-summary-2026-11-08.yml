name: Send BTTS FT daily summary 2026-11-08

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-summary-2026-11-08.yml"

permissions:
  contents: read

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout saved picks
        uses: actions/checkout@v4
      - name: Calculate and send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path

          target_day = "2026-11-08"
          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          unique = {}
          for pick in state.get("picks", []):
              if str(pick.get("date", ""))[:10] != target_day:
                  continue
              if pick.get("market") != "BTTS_FT":
                  continue
              if pick.get("delivery_status", "sent") != "sent":
                  continue
              key = str(pick.get("key") or pick.get("id") or "")
              if not key:
                  continue
              old = unique.get(key)
              if old is None or (pick.get("settled") and not old.get("settled")):
                  unique[key] = pick

          picks = list(unique.values())
          settled = [p for p in picks if p.get("settled")]
          wins = [p for p in settled if p.get("won") is True]
          losses = [p for p in settled if p.get("won") is False]
          pending = [p for p in picks if not p.get("settled")]

          def net_profit(p):
              stake = float(p.get("stake", 10) or 10)
              if not p.get("won"):
                  return -stake
              odds = float(p["odds"])
              tax = round(stake * 0.12, 2)
              payout = round(round(stake - tax, 2) * odds, 2)
              return round(payout - stake, 2)

          profit = round(sum(net_profit(p) for p in settled), 2)
          turnover = round(sum(float(p.get("stake", 10) or 10) for p in settled), 2)
          yield_pct = round(profit / turnover * 100, 2) if turnover else 0.0
          missing_odds = [p for p in wins if p.get("odds") is None]

          report = (
              "📊 PODSUMOWANIE DNIA — BTTS FT\n"
              "📅 8 listopada 2026\n\n"
              f"📨 Wysłane typy: {len(picks)}\n"
              f"✅ Rozliczone: {len(settled)}\n"
              f"🟢 Wygrane: {len(wins)}\n"
              f"🔴 Przegrane: {len(losses)}\n"
              f"⏳ Oczekujące: {len(pending)}\n\n"
              f"Obrót rozliczonych typów: {turnover:.2f} zł\n"
              f"ZYSK/STRATA NETTO: {profit:+.2f} zł\n"
              f"Yield: {yield_pct:+.2f}%\n\n"
              "Bilans obejmuje wyłącznie potwierdzone rozliczenia; "
              "oczekujące typy nie są doliczone."
          )
          if missing_odds:
              report += "\n⚠️ Część kursów wygranych typów wymaga weryfikacji."
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": report},
              timeout=20,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise RuntimeError(payload)
          print(report)
          print("TELEGRAM_SENT message_id=" + str(payload["result"]["message_id"]))
          PY
