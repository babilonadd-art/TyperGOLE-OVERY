name: TyperGOLE-OVERY — BTTS Live

on:
  push:
    branches: [main]
    paths:
      - "btts_live.py"
      - ".github/workflows/btts-live.yml"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-btts-live
  cancel-in-progress: false

jobs:
  btts-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile LIVE BTTS scanner
        run: python -m py_compile btts_live.py
      - name: Run LIVE BTTS scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
          TZ: Europe/Warsaw
        run: python btts_live.py
      - name: Persist LIVE BTTS duplicate guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/btts_live_state.json ]; then
            git add data/btts_live_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist LIVE BTTS alerts"
            git push
          fi
