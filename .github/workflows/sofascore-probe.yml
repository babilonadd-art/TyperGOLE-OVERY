name: SofaScore settlement connectivity probe

on:
  push:
    paths:
      - ".github/workflows/sofascore-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check SofaScore public endpoints (read-only)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import requests

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; TyperGOLE-OVERY/1.0; settlement-connectivity-check)",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://www.sofascore.com/",
          }
          endpoints = [
              "https://www.sofascore.com/api/v1/search/all?q=Manchester%20City",
              "https://www.sofascore.com/api/v1/sport/football/events/last/0",
          ]
          success = 0
          for url in endpoints:
              try:
                  response = requests.get(url, headers=headers, timeout=15)
                  print(f"URL: {url}")
                  print(f"HTTP: {response.status_code}")
                  print(f"CONTENT-TYPE: {response.headers.get('content-type', '')}")
                  print(f"BODY-SAMPLE: {response.text[:350].replace(chr(10), ' ')}")
                  if response.ok:
                      payload = response.json()
                      print(f"JSON: OK ({', '.join(payload.keys()) if isinstance(payload, dict) else type(payload).__name__})")
                      success += 1
                  else:
                      print("JSON: not checked (HTTP error)")
              except Exception as exc:
                  print(f"ERROR: {type(exc).__name__}: {exc}")
              print("---")
          print(f"SOFASCORE_PROBE_RESULT: {success}/{len(endpoints)} endpoints reachable")
          if success == 0:
              raise SystemExit("SofaScore unavailable from GitHub Actions runner")
          PY
