name: TyperGOLE-OVERY — BTTS FT

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "btts_ft.py"
      - "requirements.txt"
      - "tests/**"
      - "assets/**"
      - "data/state.json"
      - ".github/workflows/btts-ft.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skan diagnostyczny bez wysyłania typów na Telegram"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/5 * * * *" # skan co 5 minut; data meczów liczona w Europe/Warsaw

permissions:
  contents: write

# Nie anuluj działającego skanowania przy następnym wywołaniu cron.
# GitHub utrzyma najwyżej jeden oczekujący przebieg dla tej grupy.
concurrency:
  group: typergole-btts-ft-${{ github.event_name }}-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish manual BTTS doubles') && github.run_id || 'standard' }}
  cancel-in-progress: false

jobs:
  btts-ft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile BTTS and Over Live
        run: python -m py_compile bot.py btts_ft.py over_live.py
      # Testy wykonujemy przy zmianach kodu i ręcznym Dry Run.
      # Nie uruchamiamy 90-sekundowego zestawu testów przed każdym skanem cron.
      - name: Run automated tests
        if: github.event_name != 'schedule' && !(github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish manual BTTS doubles'))
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Scan and publish BTTS FT
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
          BTTS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          BTTS_PUBLISH_MANUAL_DOUBLES: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish manual BTTS doubles') && '1' || '0' }}
        run: |
          set -o pipefail
          python btts_ft.py 2>&1 | tee btts_dry_run.log
      - name: Upload BTTS diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btts-dry-run-log-${{ github.run_id }}
          path: btts_dry_run.log
          if-no-files-found: warn
          retention-days: 7
      - name: Persist BTTS history
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true) || github.event_name == 'push')
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist BTTS FT picks and settlement state"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi

# Manual BTTS doubles: publish four preselected pairs on the original bull poster; clean repeated Telegram messages.
# Poster prints verified competition names; daily BTTS cap reset is applied on the next scan.
# Trigger the one-time BTTS Telegram duplicate cleanup.
