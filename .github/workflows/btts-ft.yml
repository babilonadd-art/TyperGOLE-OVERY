name: TyperGOLE-OVERY — BTTS FT

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/btts-ft.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-btts-ft
  cancel-in-progress: true

jobs:
  btts-ft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main and persistent state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile BTTS bot
        run: python -m py_compile bot.py
      - name: Run BTTS FT scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python bot.py
      - name: Save BTTS state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/state.json ]; then
            git add data/state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist BTTS FT bot state"
            git push
          fi
