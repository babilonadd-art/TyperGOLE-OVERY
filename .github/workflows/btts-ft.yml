name: TyperGOLE-OVERY — BTTS FT

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "btts_ft.py"
      - "requirements.txt"
      - "tests/**"
      - "assets/**"
      - ".github/workflows/btts-ft.yml"
  workflow_dispatch: # manual full rescan after state reset; push below triggers scan after state-only reset
  schedule:
    - cron: "*/5 * * * *" # Warsaw-day scanner

permissions:
  contents: write

concurrency:
  group: typergole-btts-ft
  cancel-in-progress: true

jobs:
  btts-ft:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile BTTS and Over Live
        run: python -m py_compile bot.py btts_ft.py over_live.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Scan and publish BTTS FT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python btts_ft.py
      - name: Persist BTTS history
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist BTTS FT picks and settlement state"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi
