name: TyperGOLE-OVERY — migration from BTTS to OVER LIVE (paused)

on:
  # Uruchamiaj po zmianie kodu lub testów; zapis state.json nie uruchamia kolejnego skanu.
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "tests/**"
      - "data/state.json"
  workflow_dispatch:
  schedule:

permissions:
  contents: write

concurrency:
  group: typergole-live
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main (including saved pick state)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run clock regression tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      - name: Initialize Superbet diagnostic log
        run: |
          mkdir -p data
          : > data/superbet_diagnostics.jsonl
      - name: Safety pause — old BTTS engine must not publish as OVER LIVE
        run: echo "Bot publication is paused until the dedicated live-over engine and verified live data source are implemented."
