name: TyperGOLE-OVERY — OVER LIVE

on:
  push:
    branches: [main]
    paths:
      - "over_live.py"
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/live-bot.yml"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-over-live
  cancel-in-progress: true

jobs:
  over-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main and persistent state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile bot.py over_live.py
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
      - name: Run OVER LIVE scanner
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python over_live.py
      - name: Save duplicate protection state
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/over_live_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist OVER LIVE sent-match state"
            git push
          fi
