name: TyperGOLE-OVERY Live Bot

on:
  # Uruchamiaj po zmianie kodu lub testów; zapis state.json nie uruchamia kolejnego skanu.
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "tests/**"
  workflow_dispatch:
  schedule:
    # Najszybszy wspierany interwał harmonogramu GitHub Actions: co 5 minut.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-live
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main (including saved pick state)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run clock regression tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      - name: Initialize Superbet diagnostic log
        run: |
          mkdir -p data
          : > data/superbet_diagnostics.jsonl
      - name: Run pre-match BTTS full-time only
        # A code push runs regression tests only; it must not settle the whole queue.
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python bot.py
      - name: Save bot state
        if: always()
        run: |
          mkdir -p data
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add -f data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist live pick and settlement state"
              # Code commits can land while this scheduled job is running.
              # Rebase the saved state snapshot onto the latest main before pushing.
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo "No state file was created; nothing to persist."
          fi
      - name: Upload Superbet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superbet-diagnostics
          path: data/superbet_diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 30
