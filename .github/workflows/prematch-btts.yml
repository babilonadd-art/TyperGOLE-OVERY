name: TyperGOLE-OVERY Pre-match BTTS 1H

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # Scan nadchodzących meczów co 15 minut; wyłącznie przedmeczowe.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "prematch_btts.py"
      - "tests/test_prematch_btts.py"
      - ".github/workflows/prematch-btts.yml"

permissions:
  contents: write

concurrency:
  group: typergole-prematch-btts
  cancel-in-progress: false

jobs:
  prematch-btts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run strategy tests
        run: python -m unittest discover -s tests -v
      - name: Run pre-match BTTS scan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python prematch_btts.py
      - name: Persist picks state
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add -f data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist pre-match BTTS picks state"
              git push
            fi
          fi
