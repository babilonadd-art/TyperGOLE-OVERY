name: TyperGOLE-OVERY — Over Live

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "over_live.py"
      - "requirements.txt"
      - ".github/workflows/over-live.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: typergole-over-live
  cancel-in-progress: true

jobs:
  over-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Over Live scanner
        run: python -m py_compile bot.py over_live.py
      - name: Run Over Live scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python bot.py
