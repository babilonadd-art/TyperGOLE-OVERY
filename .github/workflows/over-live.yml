name: TyperGOLE-OVERY — Over Live

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "over_live.py"
      - "requirements.txt"
      - ".github/workflows/over-live.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: typergole-over-live
  cancel-in-progress: false

jobs:
  over-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Over Live scanner
        run: python -m py_compile bot.py over_live.py
      - name: Run Over Live scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Warsaw
        run: python bot.py
      - name: Save Over Live duplicate guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/over_live_state.json ]; then
            git add data/over_live_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist Over Live sent fixtures"
            git push
          fi
